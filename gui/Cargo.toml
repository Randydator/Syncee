[package]
name = "gui"
version = "0.1.0"
edition = "2024"

[dependencies]
core-engine = { path = "../core-engine" }

iced = { version = "0.14", features = ["tokio", "advanced"] }

tray-icon = "0.19"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
crossbeam-channel = "0.5"

rfd = "0.14"

tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1.18"

log = "0.4"
env_logger = "0.11"